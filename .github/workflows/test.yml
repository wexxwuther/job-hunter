name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # Family monorepo (v6+): no root tests/; each member owns its suite.
      # importlib mode because several members share test file names.
      - name: Run unit tests
        run: >-
          python -m pytest --import-mode=importlib -v
          job-hunter/tests career-profile/tests job-search/tests resume-tailor/tests
          cover-letter/tests application-tracker/tests outcome-learning/tests install
